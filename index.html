    import('./js/app.js?v=111-safari-parser-fix').catch((err) => {

      if (app) app.innerHTML = `<div style="min-height:100vh;background:#08090b;color:#fff;display:grid;place-items:center;font-family:Arial,sans-serif;padding:28px"><div style="max-width:520px"><div style="color:#ff2f87;font-weight:800;letter-spacing:.08em">KATALY · BOOT ERROR</div><h1 style="font-size:30px">Приложение не запустилось</h1><p style="color:#bbb;line-height:1.5">Теперь вместо чёрного экрана показывается реальная ошибка загрузки. Обнови страницу. Если сообщение останется — пришли его мне.</p><pre style="white-space:pre-wrap;background:#15151a;border:1px solid #333;border-radius:12px;padding:12px;color:#ffb6d4">${String(err && (err.stack || err.message) || err)}</pre></div></div>`;
    });
  </script>
