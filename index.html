<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#08090b" />
  <title>КАТАЛЫ · V1.1.4 VISUAL INTEGRATION</title>
  <link rel="stylesheet" href="./css/kataly.css?v=114" />
</head>
<body>
  <div id="app"><div style="min-height:100vh;background:#08090b;color:#fff;display:grid;place-items:center;font-family:Arial,sans-serif;padding:24px;text-align:center"><div><b style="font-size:24px">КАТАЛЫ</b><p id="bootStatus" style="opacity:.65">Чистая загрузка V1.1.4…</p></div></div></div>
  <script type="module">
    const showError=(label,err)=>{
      console.error('KATALY BOOT ERROR',label,err);
      const app=document.getElementById('app');
      if(app) app.innerHTML=`<div style="min-height:100vh;background:#08090b;color:#fff;display:grid;place-items:center;font-family:Arial,sans-serif;padding:28px"><div style="max-width:620px"><div style="color:#ff2f87;font-weight:800;letter-spacing:.08em">KATALY · BOOT ERROR</div><h1 style="font-size:30px">Приложение не запустилось</h1><p style="color:#bbb;line-height:1.5">Теперь ниже указано, какой именно модуль не загрузился.</p><div style="color:#ff7bad;font-weight:800;margin:12px 0">${label}</div><pre style="white-space:pre-wrap;background:#15151a;border:1px solid #333;border-radius:12px;padding:12px;color:#ffb6d4">${String(err && (err.stack || err.message || err) || 'Unknown error')}</pre></div></div>`;
    };
    const probes=[
      ['./js/state.js?v=114','state.js'],
      ['./js/bots/botEngine.js?v=114','bots/botEngine.js'],
      ['./js/multiplayer/lobby.js?v=114','multiplayer/lobby.js'],
      ['./js/poker/deck.js?v=114','poker/deck.js'],
      ['./js/poker/eventBus.js?v=114','poker/eventBus.js'],
      ['./js/poker/engine.js?v=114','poker/engine.js'],
      ['./js/poker/tableView.js?v=115','poker/tableView.js'],
      ['./js/poker/tableController.js?v=114','poker/tableController.js'],
      ['./js/tableUI.js?v=114','tableUI.js'],
      ['./js/analytics/sessionAnalysis.js?v=114','analytics/sessionAnalysis.js']
    ];
    try{
      for(const [url,label] of probes){
        const s=document.getElementById('bootStatus'); if(s)s.textContent='Проверяю '+label+'…';
        try{await import(url)}catch(e){showError(label,e);throw e;}
      }
      await import('./js/app.js?v=114');
    }catch(e){
      if(!document.querySelector('[style*="KATALY"]')) console.error(e);
    }
  </script>
</body>
</html>
