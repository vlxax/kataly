<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#08090b" />
  <title>КАТАЛЫ · V1.2.1 HTML BOOT FIX</title>
  <link rel="stylesheet" href="./css/kataly.css?v=121" />
</head>
<body>
  <div id="app">
    <div style="
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
      background:#08090b;
      color:#fff;
      font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      text-align:center
    ">
      <div>
        <div style="color:#ff2e7d;font-size:12px;font-weight:900;letter-spacing:.08em">
          KATALY · LOADING
        </div>
        <div style="margin-top:10px;font-size:22px;font-weight:800">Запускаю стол…</div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var app = document.getElementById('app');

      function showError(title, message) {
        app.innerHTML =
          '<div style="min-height:100vh;background:#08090b;color:#fff;display:grid;place-items:center;padding:28px;font-family:Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">' +
            '<div style="max-width:560px;width:100%">' +
              '<div style="color:#ff2e7d;font-weight:900;letter-spacing:.08em;font-size:12px">KATALY · BOOT INFO</div>' +
              '<h1 style="font-size:28px;margin:14px 0 10px">' + title + '</h1>' +
              '<p style="color:#c8c3c8;line-height:1.5;font-size:15px">' + message + '</p>' +
            '</div>' +
          '</div>';
      }

      // Safari blocks ES modules when index.html is opened directly via file://.
      // This is not an app bug. The app must run from GitHub Pages / http(s).
      if (location.protocol === 'file:') {
        showError(
          'Открой сайт через GitHub Pages',
          'Ты сейчас открыла index.html прямо с диска (file://). Safari блокирует загрузку JS-модулей из локального файла и показывает CORS-ошибку. Загрузи эту версию в GitHub и открывай адрес сайта через https:// — там приложение запустится нормально.'
        );
        return;
      }

      var script = document.createElement('script');
      script.type = 'module';
      script.src = './js/app.js?v=121-html-boot-fix';

      script.onerror = function () {
        showError(
          'Приложение не запустилось',
          'Не удалось загрузить основной JS-модуль. Проверь, что папка js и файл app.js загружены в корень репозитория рядом с index.html.'
        );
      };

      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
