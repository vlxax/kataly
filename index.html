<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#08090b" />
<title>КАТАЛЫ · HUMAN TABLE PATCH</title>
<link rel="stylesheet" href="./css/kataly.css?v=200" />
</head>
<body>
<div id="app"><div style="min-height:100vh;background:#08090b;color:#fff;display:grid;place-items:center;font-family:Arial,sans-serif;padding:24px;text-align:center"><div><b style="font-size:24px">КАТАЛЫ</b><p id="bootStatus" style="opacity:.65">Загрузка живого стола…</p></div></div></div>

<script type="module">
const showError=(label,err)=>{
  console.error('KATALY BOOT ERROR',label,err);
  const app=document.getElementById('app');
  if(app) app.innerHTML=`<div style="min-height:100vh;background:#08090b;color:#fff;display:grid;place-items:center;font-family:Arial,sans-serif;padding:28px"><div style="max-width:620px"><div style="color:#ff2f87;font-weight:800;letter-spacing:.08em">KATALY · BOOT ERROR</div><h1 style="font-size:30px">Приложение не запустилось</h1><p style="color:#bbb;line-height:1.5">Ниже указан модуль, который не загрузился.</p><div style="color:#ff7bad;font-weight:800;margin:12px 0">${label}</div><pre style="white-space:pre-wrap;background:#15151a;border:1px solid #333;border-radius:12px;padding:12px;color:#ffb6d4">${String(err && (err.stack || err.message || err) || 'Unknown error')}</pre></div></div>`;
};

try{
  const s=document.getElementById('bootStatus');if(s)s.textContent='Загружаю турнирный стол…';
  await import('./js/pacing.js?v=next1');
  await import('./js/app.js?v=next1');
}catch(e){
  showError('Запуск приложения',e);
}
</script>
</body>
</html>
